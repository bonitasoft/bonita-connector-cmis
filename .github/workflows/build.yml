name: Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # required by Sonar to get the blame information

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: maven

    # TODO Bonita 12.0 GA: drop the two JFROG_* secrets (only needed for the runtime snapshots and the snapshot image)
    - name: Extract secrets from Keeper
      uses: Keeper-Security/ksm-action@3a1d7a4b72f910a8ed46377b3b015fbabe60689b # v1.3.3
      with:
        keeper-secret-config: ${{ secrets.KSM_CONFIG }}
        secrets: |
          ${{ vars.KEEPER_SONARCLOUD_RECORD_ID }}/field/password > env:SONAR_TOKEN
          ${{ vars.KEEPER_JFROG_RECORD_ID }}/field/login > env:JFROG_USER
          ${{ vars.KEEPER_JFROG_RECORD_ID }}/field/password > env:JFROG_TOKEN

    # TODO Bonita 12.0 GA: remove the two steps below once Bonita 12.0 is released on Maven Central and Docker Hub
    # (only needed to resolve the runtime snapshots and pull the snapshot image used by the runtime ITs)
    - name: Setup Maven settings (Bonita Artifactory read access)
      run: mkdir -p ~/.m2 && cp .github/maven-settings.xml ~/.m2/settings.xml

    - name: Login to the Bonita Docker registry
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: bonitasoft.jfrog.io
        username: ${{ env.JFROG_USER }}
        password: ${{ env.JFROG_TOKEN }}

    - name: Build and test
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        SONAR_TOKEN: ${{env.SONAR_TOKEN}}
      run: ./mvnw -B -ntp clean verify sonar:sonar

    - name: Copy artifacts for staging
      run: |
        mkdir staging
        cp target/*.zip staging
        cp target/*.jar staging

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Connectors
        path: staging
